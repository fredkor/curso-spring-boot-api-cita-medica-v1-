# Usar una base PostgreSQL exclusiva de pruebas; no sustituye los tests automatizados.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5460/citamedica_test}
    username: ${TEST_DB_USERNAME:citamedica}
    password: ${TEST_DB_PASSWORD}
  quartz:
    auto-startup: false

logging:
  level:
    root: WARN
    mx.com.fredkor.apps.citamedica: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
