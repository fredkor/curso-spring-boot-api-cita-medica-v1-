server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-cita-medica-v1

  profiles:
    default: dev

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5460/citamedica}
    username: ${DB_USERNAME:citamedica}
    password: ${DB_PASSWORD:citamedica123}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    show-sql: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        default_schema: ${DB_SCHEMA:citamedica}
        format_sql: false

  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:citamedica}
    schemas:
      - ${DB_SCHEMA:citamedica}
    locations:
      - classpath:db/migration/catalogos
      - classpath:db/security/migration
      - classpath:db/migration/core
    placeholders:
      securitySchema: ${DB_SCHEMA:citamedica}
    validate-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    org.springframework.security: INFO
    org.springframework.security.web: INFO
    org.hibernate.stat: INFO
    org.hibernate.SQL: INFO
    org.hibernate.orm.jdbc.bind: INFO
    org.hibernate.engine.jdbc.batch.internal: INFO
    org.hibernate.orm.jdbc.batch: INFO

springdoc:
  override-with-generic-response: false
  show-actuator: true

fredkor:
  observability:
    external-service:
      url: ${EXTERNAL_SERVICE_HEALTH_URL:https://jolly-desert-0a969b710.1.azurestaticapps.net/auth/login}
      timeout-ms: ${EXTERNAL_SERVICE_HEALTH_TIMEOUT_MS:3000}
  security:
    enabled: true

    login-endpoint-enabled: true
    login-base-path: /api/v1/auth

    roles:
      ADMINISTRADOR:
        - USUARIO_CREAR
        - USUARIO_VER
        - USUARIO_MODIFICAR
        - USUARIO_ELIMINAR
        - ROL_CREAR
        - ROL_VER
        - ROL_MODIFICAR
        - ROL_ELIMINAR
        - ESPECIALIDAD_VER_TODO
        - ESPECIALIDAD_VER
        - ESPECIALIDAD_CREAR
        - ESPECIALIDAD_MODIFICAR
        - ESPECIALIDAD_ELIMINAR
        - SUCURSAL_VER_TODO
        - SUCURSAL_VER
        - SUCURSAL_CREAR
        - SUCURSAL_MODIFICAR
        - SUCURSAL_ELIMINAR
        - MEDICO_ESPECIALIDAD_VER_TODO
        - MEDICO_ESPECIALIDAD_VER
        - MEDICO_ESPECIALIDAD_CREAR
        - MEDICO_ESPECIALIDAD_MODIFICAR
        - MEDICO_ESPECIALIDAD_ELIMINAR
        - MEDICO_SUCURSAL_VER_TODO
        - MEDICO_SUCURSAL_VER
        - MEDICO_SUCURSAL_CREAR
        - MEDICO_SUCURSAL_MODIFICAR
        - MEDICO_SUCURSAL_ELIMINAR
        - CITA_CREAR
        - CITA_VER_TODO
        - CITA_CONFIRMAR
        - CITA_ATENDER
        - CITA_VER
        - CITA_MODIFICAR
        - CITA_CANCELAR
        - CITA_ELIMINAR

      MEDICO:
        - CITA_CREAR
        - CITA_VER
        - CITA_CONFIRMAR
        - CITA_CANCELAR
        - CITA_VER
        - CITA_MODIFICAR
        - CITA_ATENDER

      PACIENTE:
        - CITA_CREAR
        - CITA_VER
        - CITA_CONFIRMAR
        - CITA_CANCELAR

    jwt:
      signing-key: ${JWT_SIGNING_KEY:hjNj42VBpNNGwit8+nf9YEisgobGS27kT5chp00RBxk=}
      issuer: ${JWT_ISSUER:cita-medica-api}
      expiration: ${JWT_EXPIRATION:10m}

    public-paths:
      - /api/v1/auth/**
      - /swagger-ui.html
      - /swagger-ui/**
      - /v3/api-docs/**
      - /api/docs/**
      - /actuator/health
      - /actuator/info

    cors:
      enabled: true
      allow-credentials: true

      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

      allowed-methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS

      allowed-headers:
        - Authorization
        - Content-Type
        - Accept
        - X-Trace-Id

      exposed-headers:
        - Authorization
        - X-Trace-Id
